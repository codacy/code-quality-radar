</style></head><body><main aria-label="Bug Hunt arcade game"><header><h1>BUG HUNT<span style="color:#518b94">_</span></h1><small>ONE ROGUE AGENT. STOP ITS BUGS.</small><button id="sound" aria-pressed="false" aria-label="Enable game sound">SOUND OFF</button></header><div class="hud"><span id="level">LEVEL 01 / 03</span><span id="score">FIXED 00</span><span id="escaped">ESCAPED 00</span></div><div class="stage"><canvas id="game" width="640" height="400" aria-label="Click flying bugs to fix them before they escape"></canvas><section class="overlay" id="overlay"><div class="eyebrow" id="eyebrow">CATCH BUGS BEFORE PRODUCTION</div><h2 id="title">SHIP NO BUGS.</h2><p id="description">The agent makes bugs. You fix them.<br>Three levels. Each one faster.<br>Stop its bugs reaching production.</p><button id="start">LET'S DEBUG</button></section></div><footer><span>FIND. CLICK. FIX.</span><span id="hint">18 BUGS · 3 LEVELS</span><button id="pause" hidden>PAUSE</button></footer><p id="live" role="status" aria-live="polite"></p></main><script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),W=640,H=400,INK='#00e5df',BG='#020e1c';
const bugsprite=['001000100','000101000','011111110','110111011','001111100','111111111','001111100','010101010','100000001'];
const robot=['000001000000','000011100000','001111111100','011111111110','110000000011','110110011011','110110011011','110000000011','011111111110','000111111000','001111111100','011011110110','110011110011','000110011000','000110011000'];
let state='intro',level=0,fixed=0,escaped=0,spawned=0,resolved=0,nextSpawn=0,bugs=[],effects=[],time=0,last=0,raf=0,laughUntil=0,angryUntil=0,muted=true,audio=null,pointer=null,botX=302,botY=322,speech='',speechUntil=0,launchUntil=0,quip=0;
const speeds=[82,205,315],names=['WARM-UP','MOVING TARGETS','PRODUCTION PANIC'];
const complaints=['Oh, scrap!','Drat! Another one!','You pesky human!','Curses!','Not my beautiful bug!','Rude.','That one had potential!','Fine. FINE.','Objection!','Skill issue... mine.','I\'ll allocate more bugs.'];
const boasts=['Robots will prevail!','Another one!','Try catching this!','More bugs for you!','Works on my machine!','It\'s not a bug, it\'s a feature!','Ship it anyway!','Deploy on Friday!','No code review needed!','LGTM, probably!'];
function say(words,duration=1.35){speech=words;speechUntil=time+duration;$('live').textContent=words}
function moveBot(){botX=302+Math.sin(time*(1.25+level*.3))*238;botY=310+Math.sin(time*3.6)*12}
function sprite(rows,x,y,scale,color){ctx.fillStyle=color;rows.forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1')ctx.fillRect(Math.round(x+i*scale),Math.round(y+j*scale),scale,scale)}))}
function tone(freq,duration=.07,delay=0){if(muted||!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}
function hud(){$('level').textContent=`LEVEL 0${level+1} / 03`;$('score').textContent=`FIXED ${String(fixed).padStart(2,'0')}`;$('escaped').textContent=`ESCAPED ${String(escaped).padStart(2,'0')}`}
function show(title,description,button,eyebrow){$('title').textContent=title;$('description').textContent=description;$('start').textContent=button;$('eyebrow').textContent=eyebrow;$('overlay').hidden=false;$('pause').hidden=true;$('live').textContent=title+' '+description;}
function begin(){if(state==='paused'){resume();return}if(state==='intro'||state==='done'){level=0;fixed=0;escaped=0;time=0;angryUntil=0;laughUntil=0}spawned=0;resolved=0;bugs=[];effects=[];nextSpawn=time+.8;botX=302;botY=322;speech='Robots will prevail!';speechUntil=time+1.7;launchUntil=0;state='playing';$('overlay').hidden=true;$('pause').hidden=false;$('hint').textContent=names[level];hud();last=0;wake()}
function spawn(){const dir=botX<W/2?1:-1;bugs.push({x:botX+18,y:botY-15,base:botY-15,phase:0,dir,v:speeds[level]*(.9+Math.random()*.2),age:0});spawned++;launchUntil=time+.28;if(time>=angryUntil&&time>=speechUntil)say(boasts[(spawned+level)%boasts.length]);nextSpawn=time+[1.4,.95,.7][level]}
function resolve(b,hit){bugs.splice(bugs.indexOf(b),1);resolved++;if(hit){fixed++;angryUntil=time+1.3;laughUntil=0;say(complaints[quip++%complaints.length]);if(spawned<6)nextSpawn=Math.min(nextSpawn,time+.38);effects.push({x:b.x,y:b.y,until:time+.55});tone(640);tone(960,.07,.06)}else{escaped++;angryUntil=0;laughUntil=time+1.5;say(escaped%2?'Ha ha! Shipped!':'Robots will prevail!',1.5);[280,190,280,190].forEach((f,i)=>tone(f,.09,i*.14));$('live').textContent='Bug reached production. Your agent laughs.'}hud()}
function step(dt){time+=dt;if(state!=='playing')return;moveBot();if(spawned<6&&time>=nextSpawn)spawn();for(const b of [...bugs]){b.age+=dt;b.x+=b.dir*b.v*dt;b.y=b.base-b.age*(38+level*10)+Math.sin(b.age*(3+level)+b.phase)*30;if((b.dir===1&&b.x>W+26)||(b.dir===-1&&b.x< -26)||b.y< -26)resolve(b,false)}effects=effects.filter(e=>e.until>time);if(resolved===6&&time>Math.max(laughUntil,angryUntil)+.3){if(level===2){state='done';show(fixed===18?'CLEAN BUILD.':'BUILD COMPLETE.',`${fixed} bugs fixed. ${escaped} reached production. ${fixed===18?'Nothing gets past you.':"Catch them before the next release."}`,'PLAY AGAIN','SESSION COMPLETE');$('hint').textContent='18 BUGS · 3 LEVELS'}else{level++;state='between';show(`LEVEL 0${level+1}`,names[level]+'. The bugs are getting faster.','NEXT LEVEL',`${fixed} FIXED · ${escaped} ESCAPED`)}}}
function draw(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#082d3c';ctx.lineWidth=1;for(let r=60;r<=240;r+=60){ctx.beginPath();ctx.arc(320,178,r,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(320,20);ctx.lineTo(320,322);ctx.moveTo(70,178);ctx.lineTo(570,178);ctx.stroke();ctx.fillStyle='#0b3542';for(let i=0;i<35;i++){const x=(i*137+27)%640,y=(i*83+19)%310;ctx.fillRect(x,y,2,2)}
ctx.fillStyle='#062532';ctx.fillRect(0,345,W,55);ctx.fillStyle='#11525c';ctx.fillRect(0,344,W,1);for(let i=0;i<40;i++){ctx.fillStyle='#0a3542';ctx.fillRect(i*17,350+(i%3)*8,10,3)}
for(const b of bugs){const wing=Math.floor(time*12)%2;sprite(bugsprite,b.x-13,b.y-13,3,INK);ctx.fillStyle='#74fff2';ctx.fillRect(Math.round(b.x-24),Math.round(b.y-8-wing*7),9,6);ctx.fillRect(Math.round(b.x+15),Math.round(b.y-8-wing*7),9,6);ctx.fillStyle=BG;ctx.fillRect(Math.round(b.x-5),Math.round(b.y-3),3,3);ctx.fillRect(Math.round(b.x+4),Math.round(b.y-3),3,3)}
for(const e of effects){const a=(e.until-time)/.55;ctx.globalAlpha=a;ctx.fillStyle=INK;for(let i=0;i<8;i++){const angle=i*Math.PI/4,d=(1-a)*34;ctx.fillRect(Math.round(e.x+Math.cos(angle)*d),Math.round(e.y+Math.sin(angle)*d),3,3)}ctx.font='16px BugPixel';ctx.fillText('FIXED',e.x-16,e.y-20-(1-a)*10);ctx.globalAlpha=1}
const laughing=time<laughUntil,angry=time<angryUntil,bounce=laughing?Math.round(Math.sin(time*26)*3):angry?Math.round(Math.sin(time*32)*2):0;
const bx=Math.round(botX),by=Math.round(botY+bounce);sprite(robot,bx,by,3,INK);
ctx.fillStyle=BG;
if(laughing){ctx.fillRect(bx+9,by+15,18,9);ctx.fillStyle=INK;ctx.fillRect(bx+9,by+15,6,3);ctx.fillRect(bx+21,by+15,6,3);ctx.fillStyle=BG;ctx.fillRect(bx+12,by+24,12,3)}
else if(angry){ctx.fillRect(bx+9,by+15,6,3);ctx.fillRect(bx+21,by+15,6,3);ctx.fillRect(bx+12,by+24,12,3);ctx.fillStyle=INK;ctx.fillRect(bx+15,by+24,6,3)}
if(time<launchUntil){ctx.fillStyle=INK;ctx.fillRect(bx-6,by+15,6,6);ctx.fillRect(bx+36,by+15,6,6);ctx.fillRect(bx+15,by-12,6,6)}
if(speech&&time<speechUntil){ctx.font='16px BugPixel';const width=speech.length*12+16,x=Math.max(8,Math.min(W-width-8,bx+18-width/2)),y=Math.max(32,by-48);ctx.fillStyle=BG;ctx.fillRect(x,y,width,30);ctx.strokeStyle=INK;ctx.strokeRect(x+.5,y+.5,width-1,29);ctx.fillStyle=INK;ctx.fillText(speech,x+8,y+21);ctx.fillRect(bx+15,y+30,6,5)}
if(pointer&&state==='playing'){ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(pointer.x,pointer.y,9,0,Math.PI*2);ctx.moveTo(pointer.x-14,pointer.y);ctx.lineTo(pointer.x-5,pointer.y);ctx.moveTo(pointer.x+5,pointer.y);ctx.lineTo(pointer.x+14,pointer.y);ctx.moveTo(pointer.x,pointer.y-14);ctx.lineTo(pointer.x,pointer.y-5);ctx.moveTo(pointer.x,pointer.y+5);ctx.lineTo(pointer.x,pointer.y+14);ctx.stroke()}}
function frame(t){raf=0;if(document.hidden)return;const dt=last?Math.min((t-last)/1000,.04):0;last=t;step(dt);draw();if(state==='playing')raf=requestAnimationFrame(frame)}function wake(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
function position(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointermove',e=>{pointer=position(e)});canvas.addEventListener('pointerleave',()=>{pointer=null});canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();pointer=position(e);const b=[...bugs].reverse().find(b=>Math.abs(b.x-pointer.x)<27&&Math.abs(b.y-pointer.y)<24);if(b)resolve(b,true);else tone(100,.035)});
function pause(){if(state!=='playing')return;state='paused';show('PAUSED.','Your bugs can wait.','RESUME','TAKE A BREATHER');draw()}
function resume(){state='playing';$('overlay').hidden=true;$('pause').hidden=false;wake()}
$('start').addEventListener('click',begin);$('pause').addEventListener('click',pause);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state==='playing')pause();else if(state==='paused')resume()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});$('sound').addEventListener('click',()=>{muted=!muted;if(!muted){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}$('sound').textContent=muted?'SOUND OFF':'SOUND ON';$('sound').setAttribute('aria-pressed',String(!muted));$('sound').setAttribute('aria-label',muted?'Enable game sound':'Disable game sound');tone(700)});draw();document.fonts.ready.then(draw);
})();
</script></body></html>
